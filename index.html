<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <script>
    // Страница сна Tab Sleeper. Адрес и название страницы - в части ссылки
    // после #, она не отправляется на сервер. Работает и без расширения.
    //
    // Safari читает значок вкладки только при загрузке страницы и не замечает,
    // если его поменять позже. Поэтому значок вписываем сразу, пока страница
    // разбирается. Что вписать, страница выясняет при первом визите на сайт
    // и запоминает на 30 дней:
    //   1) значок, встроенный в страницу (data:) - если сайт это разрешает;
    //   2) ссылка на значок сайта - если встроить нельзя, но он загружается;
    //   3) первая буква сайта - если значок не загружается вообще.
    window.TS = (function () {
      var ts = { ok: false };
      try {
        var hash = new URLSearchParams(location.hash.slice(1));
        var query = new URLSearchParams(location.search);
        var target = new URL(hash.get("u") || "");
        if (!/^https?:$/.test(target.protocol)) return ts;

        ts.ok = true;
        ts.target = target.href;
        ts.origin = target.origin;
        ts.host = target.hostname.replace(/^www\./, "");
        ts.title = hash.get("t") || target.hostname;
        ts.fav = /^https?:\/\//i.test(hash.get("f") || "") ? hash.get("f") : "";
        ts.auto = hash.get("a") === "1";
        // буква по имени сайта, а не по поддомену: app.notion.com - N, mail.google.com - G
        ts.letter = (function (h) {
          if (/^[\d.]+$/.test(h) || h.indexOf(":") >= 0) return (h[0] || "?").toUpperCase();
          var parts = h.split(".").filter(Boolean);
          var i = parts.length - 2;
          if (i < 0) i = 0;
          if (i > 0 && /^(co|com|net|org|gov|edu|ac)$/.test(parts[i]) && parts[parts.length - 1].length === 2) i--;
          return ((parts[i] || "?")[0] || "?").toUpperCase();
        })(ts.host);
        ts.key = "ts-icon-v6:" + ts.host; // v6: новый ключ - старые запомненные буквы не используются

        ts.letterIcon = function () {
          var c = document.createElement("canvas");
          c.width = c.height = 64;
          var g = c.getContext("2d");
          g.fillStyle = "#7a5af8";
          g.fillRect(0, 0, 64, 64);
          g.fillStyle = "#fff";
          g.font = "bold 40px -apple-system, Helvetica, sans-serif";
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.fillText(ts.letter, 32, 35);
          return c.toDataURL("image/png");
        };

        var esc = function (s) {
          return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        };

        var cached = null;
        try { cached = JSON.parse(localStorage.getItem(ts.key) || "null"); } catch (e) {}
        ts.cached = !!(cached && cached.v && Date.now() - cached.ts < 30 * 864e5);
        ts.hasImage = ts.cached && cached.v !== "letter";
        ts.icon = ts.hasImage ? cached.v : ts.letterIcon();
        // Название вписываем прямо в тег <title> при разборе страницы -
        // Safari берёт название вкладки оттуда
        // Буквы, а не эмодзи: полоса вкладок Safari убирает эмодзи из начала названия
        ts.fullTitle = "zZ " + ts.title.replace(/^(\s*zZ\s+)+/, "");
        document.write("<title>" + esc(ts.fullTitle) + "</title>");
        document.write('<link rel="icon" href="' + esc(ts.icon) + '">');
        document.write('<link rel="shortcut icon" href="' + esc(ts.icon) + '">');
      } catch (e) {
        ts.ok = false;
      }
      if (!ts.ok) document.write("<title>zZ Tab Sleeper</title>");
      return ts;
    })();
  </script>
  <style>
    /* страница сна всегда тёмная */
    :root { --bg:#17171c; --card:#222229; --text:#ececf1; --muted:#9a9aa8; --accent:#8b8bf0; --border:#33333d; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; padding: 16px;
    }
    main {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 32px 36px; max-width: 560px; width: 100%; text-align: center; outline: none;
      transition: transform .15s ease, border-color .15s ease;
    }
    body:hover main, main:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
    .icon {
      width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 22px; overflow: hidden;
    }
    .icon img { width: 32px; height: 32px; }
    .icon.has-img { background: transparent; }
    h1 { font-size: 19px; margin: 0 0 6px; overflow-wrap: anywhere; }
    .url { color: var(--muted); font-size: 13px; margin: 0 0 20px; overflow-wrap: anywhere; }
    .hint { color: var(--accent); font-size: 13px; margin: 0; }
    footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main id="card" tabindex="0" role="button" aria-label="Вернуть страницу">
    <div class="icon" id="icon">💤</div>
    <h1 id="title">Вкладка спит</h1>
    <p class="url" id="url"></p>
    <p class="hint" id="hint">Нажми в любом месте или Enter, чтобы вернуть страницу</p>
  </main>
  <footer>Tab Sleeper - страница выгружена из памяти · v11</footer>
  <script>
    (function () {
      var ts = window.TS;
      var $ = function (id) { return document.getElementById(id); };

      if (!ts.ok) {
        $("title").textContent = "Не удалось определить адрес страницы";
        $("hint").textContent = "";
        return;
      }

      $("title").textContent = ts.title;
      // ещё раз ставим название после загрузки - на случай, если Safari
      // запомнил название, пока страница разбиралась
      function applyTitle() { if (document.title !== ts.fullTitle) document.title = ts.fullTitle; }
      applyTitle();
      window.addEventListener("load", applyTitle);
      setTimeout(applyTitle, 1000);
      document.addEventListener("visibilitychange", applyTitle);
      $("url").textContent = ts.target;
      $("icon").textContent = ts.letter;

      function restore() { location.replace(ts.target); }
      document.body.addEventListener("click", restore);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); restore(); }
      });

      if (ts.auto) {
        var wasHidden = document.visibilityState === "hidden";
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") wasHidden = true;
          else if (wasHidden) restore();
        });
      }

      function showInPage(src) {
        var img = document.createElement("img");
        img.src = src;
        img.alt = "";
        $("icon").textContent = "";
        $("icon").classList.add("has-img");
        $("icon").appendChild(img);
      }

      // Значок уже найден раньше (или у сайта его не взять) - всё уже на месте
      if (ts.hasImage) showInPage(ts.icon);
      if (ts.cached) return;

      // Первая загрузка для этого сайта: пробуем встроить настоящий значок.
      // Получится только если сайт разрешает брать значок с других страниц.
      function toDataUrl(src) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.crossOrigin = "anonymous";
          var t = setTimeout(function () { resolve(""); }, 5000);
          img.onload = function () {
            clearTimeout(t);
            try {
              if (img.naturalWidth < 2) return resolve("");
              var c = document.createElement("canvas");
              c.width = c.height = 64;
              c.getContext("2d").drawImage(img, 0, 0, 64, 64);
              resolve(c.toDataURL("image/png"));
            } catch (e) {
              resolve("");
            }
          };
          img.onerror = function () { clearTimeout(t); resolve(""); };
          img.src = src;
        });
      }

      var candidates = [];
      if (ts.fav) candidates.push(ts.fav);
      candidates.push(ts.origin + "/favicon.ico", ts.origin + "/apple-touch-icon.png");
      candidates = candidates.filter(function (c, i) { return candidates.indexOf(c) === i; });

      function plainLoad(src) {
        return new Promise(function (resolve) {
          var img = new Image();
          var t = setTimeout(function () { resolve(false); }, 5000);
          img.onload = function () { clearTimeout(t); resolve(img.naturalWidth > 1); };
          img.onerror = function () { clearTimeout(t); resolve(false); };
          img.src = src;
        });
      }

      (async function () {
        var result = "";
        // 1) встроить значок
        for (var i = 0; i < candidates.length && !result; i++) result = await toDataUrl(candidates[i]);
        // 2) встроить нельзя - берём ссылку на значок, если он загружается
        for (var j = 0; j < candidates.length && !result; j++) {
          if (await plainLoad(candidates[j])) result = candidates[j];
        }
        try {
          localStorage.setItem(ts.key, JSON.stringify({ v: result || "letter", ts: Date.now() }));
        } catch (e) {
          return;
        }
        // Нашли значок - перезагружаемся один раз, чтобы Safari взял его при загрузке.
        // 3) Не нашли - буква уже стоит, ничего не делаем.
        if (result) location.reload();
      })();
    })();
  </script>
</body>
</html>
